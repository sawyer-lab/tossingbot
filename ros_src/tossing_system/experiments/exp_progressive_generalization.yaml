# Progressive Generalization Experiment
# Train on simple shapes, test generalization from simple to complex

name: exp_progressive_generalization
description: "Progressive generalization test: simple → moderate → complex"

# Training phase
train:
  objects:
    - cube
    - cylinder
    - bar
  steps: 2000

# Progressive evaluation phases
evals:
  # Level 0: Seen objects
  seen_simple:
    description: "Training objects (baseline)"
    objects:
      - cube
      - cylinder
      - bar
    episodes: 100
    checkpoint: best

  # Level 1: Other simple shapes
  unseen_simple:
    description: "Other simple geometric shapes"
    objects:
      - sphere
      - puck
      - bolt
    episodes: 100
    checkpoint: best

  # Level 2: Moderate complexity
  moderate_complexity:
    description: "Moderate complexity shapes"
    objects:
      - L_shape
      - I_shape
      - T_shape
    episodes: 100
    checkpoint: best

  # Level 3: High complexity
  high_complexity:
    description: "High complexity shapes"
    objects:
      - C_shape
      - cross
      - H_shape
    episodes: 100
    checkpoint: best

  # Level 4: All combined
  all_combined:
    description: "All objects mixed together"
    objects:
      - cube
      - cylinder
      - bar
      - sphere
      - L_shape
      - C_shape
      - cross
    episodes: 200
    checkpoint: best
