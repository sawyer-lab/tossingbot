# Multi-Eval Baseline Experiment
# Train on L/I/T shapes, evaluate on multiple sets

name: exp_multi_eval_baseline
description: "Baseline with multi-eval: train on complex shapes, test on seen, unseen simple, and unseen complex"

# Training phase (single)
train:
  objects:
    - L_shape
    - I_shape
    - T_shape
  steps: 1500
  hyperparameters:
    learning_rate: 0.0001
    batch_size: 32
    gamma: 0.99

# Evaluation phases (multiple)
evals:
  # Eval 1: Test on training objects
  seen:
    description: "Evaluate on same objects used in training"
    objects:
      - L_shape
      - I_shape
      - T_shape
    episodes: 100
    checkpoint: best

  # Eval 2: Test on simple shapes
  unseen_simple:
    description: "Evaluate on simple geometric shapes"
    objects:
      - cube
      - cylinder
      - sphere
      - bar
    episodes: 100
    checkpoint: best

  # Eval 3: Test on complex shapes
  unseen_complex:
    description: "Evaluate on other complex shapes"
    objects:
      - C_shape
      - cross
      - puck
      - bolt
    episodes: 100
    checkpoint: best

  # Eval 4: Mixed evaluation
  mixed:
    description: "Evaluate on mix of seen and unseen objects"
    objects:
      - L_shape
      - cube
      - C_shape
      - cylinder
    episodes: 150
    checkpoint: best

# Container configuration
container:
  image: tossingbot:latest
  mount_paths:
    sessions: /workspace/sessions
    logs: /workspace/logs
  ros_master_uri: http://localhost:11311

# Analysis configuration
analysis:
  moving_average_window: 50
  report_format: pdf
