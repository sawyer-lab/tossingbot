# Custom PID Gains for TossingBot with Heavy EE
# We increase these to compensate for the added mass/inertia in Gazebo

sawyer:
  joint_config:
    joint_control_parameters:
      # Joint J0 (Base/Shoulder)
      right_j0:
        pid: {p: 5000.0, i: 10.0, d: 100.0}
      # Joint J1 (Shoulder) - Most affected by weight
      right_j1:
        pid: {p: 10000.0, i: 50.0, d: 200.0}
      # Joint J2 (Shoulder)
      right_j2:
        pid: {p: 5000.0, i: 10.0, d: 50.0}
      # Joint J3 (Elbow)
      right_j3:
        pid: {p: 5000.0, i: 10.0, d: 50.0}
      # Joint J4 (Wrist)
      right_j4:
        pid: {p: 1000.0, i: 1.0, d: 10.0}
      # Joint J5 (Wrist)
      right_j5:
        pid: {p: 1000.0, i: 1.0, d: 10.0}
      # Joint J6 (Wrist)
      right_j6:
        pid: {p: 500.0, i: 0.1, d: 5.0}

# Gripper controller gains (if using position control)
# Standard rethink pneumatic doesn't always use PIDs in sim, 
# but if it's acting squishy, we can boost it here.
tossingbot_gripper:
  joint_control_parameters:
    right_gripper_l_finger_joint:
      pid: {p: 1000.0, i: 0.1, d: 1.0}
    right_gripper_r_finger_joint:
      pid: {p: 1000.0, i: 0.1, d: 1.0}
